<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Plush Felt UI (CSS Simulation)</title>

<!-- Define the SVG filter for the fuzzy, frayed edge -->
<svg style="position: absolute; width: 0; height: 0;">
  <filter id="fuzz-edge" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="3" result="noise" />
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="18" xChannelSelector="R" yChannelSelector="G" result="frayed" />
    <feDropShadow dx="0" dy="15" stdDeviation="12" flood-color="#000" flood-opacity="0.12" />
  </filter>
</svg>

<style>
  /* Variables for exact colors */
  :root {
    --cream: #f3efe6;
    --bg: #ded6c9;
    --blue: #3c4f88;
    --red: #c74538;
    --green: #3b7159;
    --yellow: #c9962a;
    --dark: #1a1a1a;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: var(--bg);
    font-family: 'Arial Black', 'Helvetica Neue', sans-serif;
    overflow: hidden;
    padding: 20px;
  }

  /* Colored blurred blobs in the background */
  .blob {
    position: absolute;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    filter: blur(120px);
    z-index: -1;
    opacity: 0.7;
  }
  .blob-1 { background: #dcc07a; top: -100px; left: -100px; }
  .blob-2 { background: #7a94c6; bottom: -100px; right: -100px; }

  .mockup-wrapper {
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  /* Rows */
  .row {
    display: flex;
    gap: 14px;
    width: 100%;
  }

  /* ============================================================ */
  /* THE CORE FLUFFY WIDGET BASE                                  */
  /* ============================================================ */
  .widget {
    position: relative;
    background: var(--cream);
    border-radius: 40px;
    padding: 16px;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 8px 12px rgba(0,0,0,0.08), inset 0 1px 2px rgba(255,255,255,0.8);
    flex: 1;
  }
  
  /* The frayed "fur" border applied only to the background */
  .widget::before {
    content: '';
    position: absolute;
    inset: -16px;
    background: var(--cream);
    border-radius: 50px;
    /* Apply the SVG displacement filter here to fuzz the edge */
    filter: url(#fuzz-edge);
    z-index: -1;
  }

  /* ============================================================ */
  /* SHAPES & LAYOUTS                                            */
  /* ============================================================ */
  .grid-2x2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 12px;
    width: 100%;
    height: 100%;
  }
  .circle { border-radius: 50%; aspect-ratio: 1 / 1; flex: 1; }
  .pill { border-radius: 100px; flex: 1; }

  /* ============================================================ */
  /* SUNKEN 3D FELT BUTTONS (Inside Grid)                        */
  /* ============================================================ */
  .tile {
    border-radius: 50%;
    aspect-ratio: 1 / 1;
    display: flex;
    justify-content: center;
    align-items: center;
    /* Deep inner shadow + outer cast shadow to look like felt disks */
    box-shadow: inset 0 2px 4px rgba(255,255,255,0.5), 
                0 8px 0 rgba(0,0,0,0.15), 
                0 10px 12px rgba(0,0,0,0.1);
    padding: 12px;
  }
  .tile.blue { background: var(--blue); }
  .tile.red { background: var(--red); }
  .tile.green { background: var(--green); }
  .tile.yellow { background: var(--yellow); }

  /* ============================================================ */
  /* 3D PUFF-PRINT TEXT & ICONS                                   */
  /* ============================================================ */
  .puff-icon {
    width: 55%;
    height: 55%;
    fill: var(--dark);
    /* Top white highlight, bottom deep black shadow for 3D */
    filter: drop-shadow(0 -1px 0 rgba(255,255,255,0.5)) 
            drop-shadow(0 2px 0 rgba(0,0,0,0.2)) 
            drop-shadow(0 4px 4px rgba(0,0,0,0.2));
  }

  /* TOP RIGHT NIKE MEDIA WIDGET */
  .nike-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    width: 100%;
  }
  .nike-text {
    display: flex;
    font-size: 34px;
    letter-spacing: -2px;
    /* The "puff print" 3D extrusion shadow */
    text-shadow: 0 2px 0 #fff, 0 4px 0 rgba(0,0,0,0.1), 0 6px 6px rgba(0,0,0,0.2);
  }
  .nike-text span:nth-child(1) { color: var(--blue); }
  .nike-text span:nth-child(2) { color: var(--green); }
  .nike-text span:nth-child(3) { color: var(--red); }
  .nike-text span:nth-child(4) { color: var(--yellow); }
  .nike-swoosh {
    width: 40px;
    margin-left: -6px;
    transform: rotate(-12deg);
    filter: drop-shadow(0 2px 2px rgba(0,0,0,0.2));
  }
  .nike-sub {
    font-size: 10px; color: #333; line-height: 1; text-shadow: 0 1px 0 #fff;
  }
  .media-controls {
    display: flex; gap: 14px; font-size: 14px; font-weight: bold; color: var(--dark);
    text-shadow: 0 1px 0 #fff, 0 2px 2px rgba(0,0,0,0.2);
  }

  /* ROW 2 - MOON/SUN PILL */
  .split-pill {
    padding: 0;
    overflow: hidden;
    background: linear-gradient(to bottom, var(--blue) 50%, var(--cream) 50%);
  }
  .split-pill::before { background: linear-gradient(to bottom, var(--blue) 50%, var(--cream) 50%); }
  .top-half { height: 50%; width: 100%; display: flex; justify-content: center; align-items: flex-end; padding-bottom: 4px; }
  .bottom-half { height: 50%; width: 100%; display: flex; justify-content: center; align-items: flex-start; padding-top: 4px; }

  /* ROW 2 - NIKE "JUST DO IT" PILL */
  .nike-pill {
    display: flex; flex-direction: column; justify-content: space-between; padding: 10px 12px;
  }
  .nike-pill .small-swoosh { display: flex; align-items: center; font-size: 18px; }
  .nike-pill .small-swoosh svg { width: 24px; transform: rotate(-12deg); }
  .just-do-it {
    font-size: 12px;
    font-weight: bold;
    color: var(--dark);
    letter-spacing: -0.5px;
    /* Extreme puff print text shadow */
    text-shadow: 0 1px 0 #fff, 0 2px 0 rgba(0,0,0,0.1), 0 4px 6px rgba(0,0,0,0.2), 0 6px 8px rgba(0,0,0,0.1);
    display: flex; flex-direction: column; align-items: center;
  }
  .just-do-it small { font-size: 5px; }

  /* BOTTOM INPUT BAR */
  .input-bar {
    background: #1a222f;
    color: #a0a0a0;
    padding: 18px 20px;
    border-radius: 40px;
    font-size: 16px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    margin-top: 10px;
    cursor: text;
    font-family: sans-serif;
  }

  @media (max-width: 400px) {
    .mockup-wrapper { max-width: 320px; gap: 14px; }
    .nike-text { font-size: 26px; }
    .nike-swoosh { width: 30px; }
  }
</style>
</head>
